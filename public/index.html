<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界时钟 - World Clock</title>
<style>
  :root { --ink:#1c2333; --blue:#2f7cf6; --violet:#7c5cf6; --teal:#12b5a5; --amber:#f5a623; --red:#e5484d; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; color: var(--ink);
    background: linear-gradient(180deg, #eaf3ff 0, #f7f9fc 240px, #f7f9fc 100%); min-height: 100vh; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 18px 16px 48px; }

  /* Top bar: brand left, avatar right */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 44px; height: 44px; flex: none; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--blue), var(--violet)); color: #fff; font-size: 22px; font-weight: 800;
    box-shadow: 0 6px 16px rgba(64,110,246,.35); }
  .brand h1 { font-size: 20px; margin: 0; line-height: 1.2; }
  .brandsub { color: #7a8699; font-size: 12px; margin-top: 2px; }
  
  .topright { display: flex; align-items: center; gap: 12px; flex: none; position: relative; }
  .clock { text-align: right; line-height: 1.25; }
  .clock-time { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
  .clock-date { color: #7a8699; font-size: 12px; }
  
  .avatar { width: 44px; height: 44px; flex: none; border-radius: 50%; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--teal), var(--blue)); border: 2px solid #fff;
    box-shadow: 0 4px 14px rgba(30,120,200,.35); transition: transform 0.15s; }
  .avatar:active { transform: scale(.96); }

  /* 右上角登录下拉弹窗 */
  .login-popover {
    position: absolute;
    top: 56px;
    right: 0;
    width: 280px;
    background: #fff;
    border: 1px solid #e6ebf2;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(30,60,120,.15);
    display: none;
    flex-direction: column;
    z-index: 1000;
    animation: popDown 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    transform-origin: top right;
  }
  .login-popover.show { display: flex; }
  @keyframes popDown {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  /* 世界时钟网格 */
  .world-clocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 10px; }
  .w-clock-card { background: #fff; border: 1px solid #e6ebf2; border-radius: 14px; padding: 24px 20px; text-align: center; box-shadow: 0 4px 18px rgba(30,60,120,.06); position: relative; overflow: hidden; }
  .w-clock-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--blue), var(--violet)); opacity: 0.8; }
  .w-city { font-size: 18px; font-weight: 700; color: #1c2333; margin-bottom: 8px; }
  .w-time { font-size: 32px; font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .w-date { font-size: 13px; color: #7a8699; margin-top: 6px; font-weight: 500; }

  h2 { font-size: 15px; margin: 26px 0 10px; color: #223; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--violet)); flex: none; }
  .card { background: #fff; border: 1px solid #e6ebf2; border-radius: 14px; padding: 16px; box-shadow: 0 4px 18px rgba(30,60,120,.06); }
  
  input, select { padding: 9px 11px; border: 1px solid #ccd6e4; border-radius: 9px; font-size: 14px; background: #fff; width: 100%; box-sizing: border-box; }
  input:focus, select:focus { outline: 2px solid rgba(47,124,246,.35); border-color: var(--blue); }
  button { padding: 9px 15px; border: 0; border-radius: 9px; background: linear-gradient(135deg, var(--blue), var(--violet)); color: #fff; font-size: 14px; cursor: pointer; box-shadow: 0 3px 10px rgba(64,110,246,.25); }
  button.ghost { background: #eef2f8; color: #1c2333; box-shadow: none; }
  button.danger { background: var(--red); box-shadow: none; }
  button.small { padding: 5px 10px; font-size: 12px; margin-right: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
  th { color: #667; font-weight: 600; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .code { font-size: 20px; font-weight: 700; letter-spacing: 1px; background: #fff8e6; border: 1px dashed #d9a441; padding: 10px 14px; border-radius: 8px; display: inline-block; }
  .tag { padding: 1px 7px; border-radius: 9px; font-size: 12px; background: #e8f5e9; color: #22733a; }
  .tag.revoked { background: #fdecea; color: #b03a2e; }
  .tag.issued { background: #eef2fb; color: #33519c; }
  .muted { color: #889; font-size: 12px; }
  .hidden { display: none !important; }
  #msg { margin: 10px 0 0; color: #b03a2e; min-height: 18px; font-size: 13px; text-align: center; }

  @media (max-width: 640px) {
    .wrap { padding: 14px 10px 40px; }
    .card { padding: 12px; }
    .row { flex-direction: column; align-items: stretch; }
    .row input, .row select, .row button { width: 100% !important; min-width: 0 !important; flex: none !important; box-sizing: border-box; }
    
    .login-popover { position: fixed; top: 76px; left: 16px; right: 16px; width: auto; transform-origin: top center; }
    
    .clock { display: none; } /* 移动端隐藏顶部小时间，给世界时钟让出视觉焦点 */
    .brand h1 { font-size: 18px; }
    
    table, tbody, tr, td, th { display: block; width: 100%; box-sizing: border-box; }
    thead { display: none; }
    tbody tr { border: 1px solid #e2e5ec; border-radius: 8px; padding: 10px 12px; margin: 0 0 10px; }
    tbody tr:last-child { margin-bottom: 0; }
    td { border-bottom: 0; padding: 3px 0; overflow-wrap: anywhere; }
    td[data-label] { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
    td[data-label]::before { content: attr(data-label); flex: 0 0 60px; color: #889; font-size: 12px; }
    tbody td:first-child { font-size: 14px; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px dashed #eceef2; }
    tbody td[colspan] { border-bottom: 0; margin-bottom: 0; padding-bottom: 3px; }
    td.acts { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
    td.acts button.small { margin: 0; padding: 7px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="logo">V</div>
      <div>
        <h1 id="brandTitle">世界时间工具</h1>
        <div class="brandsub" id="brandSub">全球时钟一览</div>
      </div>
    </div>
    
    <div class="topright">
      <div class="clock" id="topClock">
        <div id="clockTime" class="clock-time">--:--:--</div>
        <div id="clockDate" class="clock-date"></div>
      </div>
      <!-- 右上角小人头像 -->
      <button id="avatarBtn" class="avatar" title="菜单" aria-label="菜单">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 20c1.2-3.4 4.2-5 8-5s6.8 1.6 8 5" fill="#fff"/></svg>
      </button>

      <!-- 隐藏在头像下的密码输入框弹窗 -->
      <div id="loginBox" class="login-popover">
        <div style="font-weight: 700; font-size: 16px; margin-bottom: 12px;">管理员验证</div>
        <input id="pw" type="password" placeholder="请输入管理员密码" style="margin-bottom: 10px;">
        <select id="loginDays" title="密码保存天数" style="margin-bottom: 12px;">
          <option value="1">保存 1 天</option>
          <option value="7">保存 7 天</option>
          <option value="30">保存 30 天</option>
        </select>
        <button id="loginBtn" style="width: 100%;">登录后台</button>
        <div id="msg"></div>
      </div>
    </div>
  </header>

  <!-- 默认首页：世界时钟视图 (伪装面板) -->
  <div id="homeView">
    <div class="world-clocks" id="worldClocksGrid">
      <!-- 这里的时钟卡片由 JS 动态生成 -->
    </div>
  </div>

  <!-- 后台主界面 (登录后才显示) -->
  <div id="console" class="hidden">
    <div class="row" style="justify-content:flex-end;margin:2px 0 6px">
      <a href="/summary.html" style="text-decoration:none"><button class="small">📊 本月汇总</button></a>
    </div>
    <h2>给新用户激活</h2>
    <div class="card">
      <div class="row">
        <input id="mc" placeholder="用户的机器码" style="flex:2;min-width:220px" class="mono">
        <input id="durVal" type="number" min="1" value="365" style="width:90px">
        <select id="durUnit">
          <option value="minute">分钟</option>
          <option value="hour">小时</option>
          <option value="day" selected>天</option>
          <option value="perm">永久</option>
        </select>
        <select id="channel">
          <option value="main" selected>直营</option>
          <option value="dist">分销</option>
        </select>
        <input id="note" placeholder="备注（客户名）" style="flex:1;min-width:140px">
      </div>
      <div class="row" style="margin-top:10px">
        <button id="issueBtn">生成激活码</button>
        <button id="openBtn" class="ghost">直接开通（免输码）</button>
        <span id="issueMsg" class="muted"></span>
      </div>
      <div id="codeOut" style="margin-top:12px" class="hidden">
        <span class="code mono" id="codeText"></span>
        <button id="copyBtn" class="ghost small">复制</button>
        <div class="muted" style="margin-top:6px">把这个码发给用户，他在客户端输一次就行。码已和上面这台机器绑定，别人用不了。</div>
      </div>
    </div>

    <h2>设备总表 <button id="refreshBtn" class="ghost small">刷新</button></h2>
    <div id="pendingBox" class="card hidden" style="margin-bottom:10px"></div>
    <div class="card">
      <div class="row" style="margin-bottom:8px"><input id="qDevices" placeholder="搜索：机器码 / 客户名" oninput="applyFilter('qDevices','tbody')" style="flex:1"></div>
      <table>
        <thead><tr>
          <th>机器码</th><th>客户名</th><th>平台</th><th>激活</th><th>到期</th>
          <th>最近打开</th><th>拉取</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="9" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>

    <h2>已发出的码（还没激活）</h2>
    <div class="card">
      <div class="row" style="margin-bottom:8px"><input id="qIssued" placeholder="搜索：机器码 / 备注" oninput="applyFilter('qIssued','issuedBody')" style="flex:1"></div>
      <table>
        <thead><tr><th>机器码 / 备注</th><th>天数</th><th>渠道</th><th>发出时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="issuedBody"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>

    <h2>分销商管理</h2>
    <div class="card">
      <div class="row">
        <input id="dslug" placeholder="登录标识，如 mmm" style="width:150px" class="mono">
        <input id="dname" placeholder="分销商名称" style="width:150px">
        <input id="dpw" placeholder="密码（可留空）" style="width:190px">
        <input id="dquota" type="number" placeholder="额度（个数）" style="width:120px" value="100">
        <select id="dparent" style="width:210px"><option value="">上级：总后台直属（第1级）</option></select>
        <button id="distCreateBtn">添加分销商</button>
        <span id="distMsg" class="muted"></span>
      </div>
      <div class="row" style="margin-bottom:8px; margin-top:8px;"><input id="qDists" placeholder="搜索：标识 / 名称" oninput="applyFilter('qDists','distBody')" style="flex:1"></div>
      <table>
        <thead><tr><th>登录地址</th><th>额度</th><th>状态</th><th>操作</th><th>标识 / 名称</th></tr></thead>
        <tbody id="distBody"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>

    <h2>进货流水</h2>
    <div class="card">
      <div id="stockAll" class="muted">加载中…</div>
    </div>

    <h2>游客客户（小火箭等）</h2>
    <div class="card">
      <div class="row">
        <input id="guser" placeholder="用户名（客户名）" style="width:150px">
        <input id="gpw" placeholder="密码（至少 6 位）" style="width:170px">
        <input id="gdurVal" type="number" min="1" value="365" style="width:80px">
        <select id="gdurUnit">
          <option value="minute">分钟</option>
          <option value="hour">小时</option>
          <option value="day" selected>天</option>
          <option value="perm">永久</option>
        </select>
        <input id="gnote" placeholder="备注（可空）" style="width:140px">
        <input id="glimit" type="number" min="0" max="999" placeholder="每日拉取上限" style="width:120px">
        <button id="guestCreateBtn">添加游客</button>
        <span id="guestMsg" class="muted"></span>
      </div>
      <div class="row" style="margin-bottom:8px; margin-top:8px;"><input id="qGuests" placeholder="搜索：用户名 / 备注" oninput="applyFilter('qGuests','guestBody')" style="flex:1"></div>
      <table>
        <thead><tr><th>用户名 / 备注</th><th>专属页面</th><th>到期</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="guestBody"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const api = async (path, opts = {}) => {
  const sess = (() => { try { return localStorage.getItem("v2sess"); } catch { return null; } })();
  const tries = !opts.method || opts.method === "GET" ? 3 : 1;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(path, {
        cache: "no-store",
        headers: { "content-type": "application/json", ...(sess ? { "x-session": sess } : {}) },
        ...opts,
      });
      return { status: r.status, data: await r.json().catch(() => ({})) };
    } catch (e) {
      if (i === tries - 1) return { status: 0, data: { ok: false, reason: "network" } };
      await new Promise((res) => setTimeout(res, 700));
    }
  }
};
const fmt = (ts) => ts ? new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false }) : "—";

// 登录成功后进入后台
function enterConsole() {
  $("loginBox").classList.remove("show"); // 隐藏登录弹窗
  $("homeView").classList.add("hidden");  // 隐藏伪装的世界时钟
  $("topClock").style.display = "block"; // 显示后台的右上角小时间
  
  // 修改左上角标题为后台模式
  $("brandTitle").textContent = "v2one999 授权后台";
  $("brandSub").textContent = "管理控制台";
  document.title = "v2one999 授权后台";

  $("console").classList.remove("hidden"); // 显示主控制台
  
  loadDevices();
  loadDists();
  loadStock();
  loadGuests();
}

// 登录请求
async function doLogin() {
  const days = Number($("loginDays").value) || 1;
  const { status, data } = await api("/api/admin/login", {
    method: "POST", body: JSON.stringify({ password: $("pw").value, days }),
  });
  if (status === 200 && data.ok) {
    if (data.session) { try { localStorage.setItem("v2sess", data.session); localStorage.setItem("v2days", String(days)); } catch {} }
    $("pw").value = ""; // 清空密码框
    enterConsole();
  } else {
    $("msg").textContent = "密码不对";
  }
}

try { const d = localStorage.getItem("v2days"); if (d) $("loginDays").value = d; } catch {}
$("loginBtn").onclick = doLogin;
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

// 自动静默登录检测
(async () => {
  for (let i = 0; i < 4; i++) {
    const { status, data } = await api("/api/admin/ping");
    if (data && data.ok) { enterConsole(); return; }
    if (status === 401) return;
    await new Promise((res) => setTimeout(res, 1500));
  }
})();

// 点击头像展开/收起登录弹窗
$("avatarBtn").addEventListener("click", (e) => {
  e.stopPropagation(); // 阻止事件冒泡，防止触发全局关闭
  const lb = $("loginBox");
  lb.classList.toggle("show");
  if (lb.classList.contains("show")) {
    $("msg").textContent = ""; // 每次打开清空错误提示
    setTimeout(() => $("pw").focus(), 50); // 自动对焦输入框
  }
});

// 点击页面其他空白处，自动收起登录弹窗
document.addEventListener("click", (e) => {
  const lb = $("loginBox");
  if (lb.classList.contains("show") && !lb.contains(e.target)) {
    lb.classList.remove("show");
  }
});


// ---- 以下为后台业务逻辑保留区域 (维持原有逻辑不变) ---- //
function machineOk(v) { return /^[0-9A-HJKMNP-TV-Z]{16}$/.test((v || "").toUpperCase().replace(/[\s-]/g, "")); }
const BAD_MACHINE_MSG = "这不是机器码，像是激活码；机器码在客户端激活页上，格式是 XXXX-XXXX-XXXX-XXXX";
function durFields(valId, unitId) {
  const unit = $(unitId).value;
  if (unit === "perm") return { days: 0 };
  return { durationValue: Number($(valId).value || 0), durationUnit: unit };
}
$("issueBtn").onclick = async () => {
  const body = { machineCode: $("mc").value.trim(), ...durFields("durVal", "durUnit"), note: $("note").value.trim(), channel: $("channel").value, mode: "code" };
  if (!machineOk(body.machineCode)) { $("issueMsg").textContent = BAD_MACHINE_MSG; return; }
  const { data } = await api("/api/admin/issue", { method: "POST", body: JSON.stringify(body) });
  if (data.ok) { $("codeText").textContent = data.code; $("codeOut").classList.remove("hidden"); $("issueMsg").textContent = "";
  } else $("issueMsg").textContent = "失败：" + (data.reason === "bad_machine" ? BAD_MACHINE_MSG : data.reason || "");
};
$("openBtn").onclick = async () => {
  const body = { machineCode: $("mc").value.trim(), ...durFields("durVal", "durUnit"), note: $("note").value.trim(), channel: $("channel").value, mode: "open" };
  if (!machineOk(body.machineCode)) { $("issueMsg").textContent = BAD_MACHINE_MSG; return; }
  const { data } = await api("/api/admin/issue", { method: "POST", body: JSON.stringify(body) });
  $("issueMsg").textContent = data.ok ? "已开通" : "失败：" + data.reason;
  if (data.ok) loadDevices();
};
$("copyBtn").onclick = () => navigator.clipboard.writeText($("codeText").textContent);

async function act(machine, action, days) {
  if (action === "delete" && !confirm(`彻底删除设备 ${machine}？`)) return;
  const { data } = await api("/api/admin/action", { method: "POST", body: JSON.stringify({ machineCode: machine, action, days }) });
  if (!data.ok) alert("失败：" + (data.reason || ""));
  loadDevices();
}
window.act = act;

const pad2 = (n) => String(n).padStart(2, "0");
function localTimeText(ts) { const d = new Date(ts * 1000); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
async function editExpiry(machine, expiresAt) {
  const example = localTimeText(Math.floor(Date.now() / 1000) + 30 * 86400);
  const v = prompt(`修改到期时间（当前：${expiresAt ? fmt(expiresAt) : "永久"}）\n格式：${example}\n填 0 = 永久`, expiresAt ? localTimeText(expiresAt) : "");
  if (v === null || v.trim() === "") return;
  let exp = null;
  if (v.trim() !== "0" && v.trim() !== "永久") {
    const dt = new Date(v.trim().replace(/-/g, '/'));
    if (isNaN(dt.getTime())) { alert("时间格式错误"); return; }
    exp = Math.floor(dt.getTime() / 1000);
  }
  const { data } = await api("/api/admin/action", { method: "POST", body: JSON.stringify({ machineCode: machine, action: "set_expiry", expires_at: exp }) });
  if (!data.ok) alert("失败");
  loadDevices();
}
window.editExpiry = editExpiry;

const devNoteMap = {};
function applyFilter(inputId, bodyId) {
  const q = ($(inputId).value || "").trim().toLowerCase();
  const rows = [...$(bodyId).querySelectorAll("tr")].filter(tr => !tr.querySelector("td[colspan]") && !tr.classList.contains("nomatch"));
  let nm = $(bodyId).querySelector("tr.nomatch");
  if (!rows.length) return;
  let visible = 0;
  for (const tr of rows) { const hit = !q || tr.textContent.toLowerCase().includes(q); tr.style.display = hit ? "" : "none"; if (hit) visible++; }
  if (q && visible === 0) {
    if (!nm) { nm = document.createElement("tr"); nm.className = "nomatch"; nm.innerHTML = '<td colspan="9" class="muted">没有匹配的结果</td>'; $(bodyId).appendChild(nm); }
    nm.style.display = "";
  } else if (nm) nm.remove();
}
window.applyFilter = applyFilter;

async function editNote(machine) {
  const cur = devNoteMap[machine] || "";
  const v = prompt(`修改备注（当前：${cur || "未填"}）：`, cur);
  if (v !== null) { await api("/api/admin/action", { method: "POST", body: JSON.stringify({ machineCode: machine, action: "set_note", note: v.trim() }) }); loadDevices(); }
}
window.editNote = editNote;

function renderIssued(list) {
  if (!list.length) { $("issuedBody").innerHTML = '<tr><td colspan="6" class="muted">还没有发出过码</td></tr>'; return; }
  $("issuedBody").innerHTML = list.map((i) => `<tr>
    <td class="mono">${i.machine || "—"}<div class="muted">${i.note || ""}</div></td>
    <td data-label="天数">${i.duration_text || (i.days === 0 ? "永久" : i.days + " 天")}</td>
    <td data-label="渠道">${i.channel === "dist" ? "分销" : "直营"}</td>
    <td data-label="发出时间">${fmt(i.created_at)}</td>
    <td data-label="状态">${i.status === "open" ? "待领取" : "未激活"}</td>
    <td class="acts">${i.code ? `<button class="small ghost" onclick="copyIssued('${i.code}')">复制码</button> ` : ""}<button class="small danger" onclick="revokeCode('${i.licKey}')">作废</button></td></tr>`).join("");
}
window.revokeCode = async (licKey) => { if (confirm("确定作废？")) { await api("/api/admin/action", { method: "POST", body: JSON.stringify({ licKey, action: "revoke" }) }); loadDevices(); } };
window.copyIssued = async (code) => { try { await navigator.clipboard.writeText(code); alert("已复制"); } catch { prompt("复制：", code); } };

async function loadDevices() {
  const { status, data } = await api("/api/admin/devices");
  if (!data.ok) return;
  renderIssued(data.issued || []);
  if (!data.devices.length) { $("tbody").innerHTML = '<tr><td colspan="9" class="muted">还没有设备</td></tr>'; return; }
  $("tbody").innerHTML = data.devices.map((d) => {
    const lic = d.lic || {}; devNoteMap[d.machine] = lic.note || "";
    return `<tr>
      <td class="mono">${d.machine}</td>
      <td data-label="客户名">${lic.note || '<span class="muted">未填</span>'}</td>
      <td data-label="平台">${d.platform || "—"}</td>
      <td data-label="激活">${fmt(lic.activated_at)}</td>
      <td data-label="到期">${lic.expires_at ? fmt(lic.expires_at) : (lic.days === 0 ? "永久" : "—")}</td>
      <td data-label="最近打开">${fmt(d.last_seen)}</td>
      <td data-label="拉取">${d.pulls}</td>
      <td data-label="状态"><span class="tag">${lic.status || "—"}</span></td>
      <td class="acts"><button class="small ghost" onclick="act('${d.machine}','unbind')">解绑</button>
      <button class="small ghost" onclick="editExpiry('${d.machine}', ${lic.expires_at || 0})">改期</button>
      <button class="small ghost" onclick="editNote('${d.machine}')">备注</button>
      <button class="small danger" onclick="act('${d.machine}','delete')">删除</button></td></tr>`;
  }).join("");
}
$("refreshBtn").onclick = loadDevices;

<script>
// --- 世界时钟与基础时间逻辑 ---
(() => {
  // 定义要在主页展示的世界城市
  const worldCities = [
    { id: "bj", name: "北京 / 亚洲", tz: "Asia/Shanghai" },
    { id: "ty", name: "东京 / 亚洲", tz: "Asia/Tokyo" },
    { id: "ld", name: "伦敦 / 欧洲", tz: "Europe/London" },
    { id: "ny", name: "纽约 / 美洲", tz: "America/New_York" },
    { id: "la", name: "洛杉矶 / 美洲", tz: "America/Los_Angeles" },
    { id: "sy", name: "悉尼 / 澳洲", tz: "Australia/Sydney" }
  ];

  // 初始化世界时钟网格 HTML
  const wcGrid = document.getElementById("worldClocksGrid");
  if (wcGrid) {
    wcGrid.innerHTML = worldCities.map(c => `
      <div class="w-clock-card">
        <div class="w-city">${c.name}</div>
        <div id="wt-${c.id}" class="w-time">--:--:--</div>
        <div id="wd-${c.id}" class="w-date">--月--日</div>
      </div>
    `).join("");
  }

  const t = document.getElementById("clockTime"), d = document.getElementById("clockDate");
  const wk = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  const p2 = (n) => String(n).padStart(2, "0");

  const tick = () => {
    // 1. 更新后台右上角的小时钟（本地时间）
    const now = new Date();
    if (t) t.textContent = p2(now.getHours()) + ":" + p2(now.getMinutes()) + ":" + p2(now.getSeconds());
    if (d) d.textContent = now.getFullYear() + "-" + p2(now.getMonth() + 1) + "-" + p2(now.getDate()) + " " + wk[now.getDay()];

    // 2. 更新主页的世界时钟表盘（仅当主页显示时执行以省性能）
    if (!document.getElementById("homeView").classList.contains("hidden")) {
      worldCities.forEach(c => {
        const timeEl = document.getElementById(`wt-${c.id}`);
        const dateEl = document.getElementById(`wd-${c.id}`);
        
        if(timeEl) timeEl.textContent = now.toLocaleString("zh-CN", { timeZone: c.tz, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if(dateEl) dateEl.textContent = now.toLocaleString("zh-CN", { timeZone: c.tz, month: 'short', day: 'numeric', weekday: 'short' });
      });
    }
  };
  
  tick(); setInterval(tick, 1000);
})();
</script>
