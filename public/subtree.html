<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下级名下</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f4f5f7; color: #1c2333; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 15px; margin: 22px 0 10px; color: #334; }
  .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(20,30,60,.08); }
  input, select { padding: 8px 10px; border: 1px solid #ccd2dd; border-radius: 6px; font-size: 14px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #14181f; color: #fff; font-size: 14px; cursor: pointer; }
  button.ghost { background: #e8ebf0; color: #1c2333; }
  button.danger { background: #c0392b; }
  button.small { padding: 4px 9px; font-size: 12px; margin-right: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eceef2; vertical-align: top; }
  th { color: #667; font-weight: 600; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .code { font-size: 20px; font-weight: 700; letter-spacing: 1px; background: #fff8e6; border: 1px dashed #d9a441; padding: 10px 14px; border-radius: 8px; display: inline-block; }
  .tag { padding: 1px 7px; border-radius: 9px; font-size: 12px; background: #e8f5e9; color: #22733a; }
  .tag.revoked { background: #fdecea; color: #b03a2e; }
  .tag.issued { background: #eef2fb; color: #33519c; }
  .muted { color: #889; font-size: 12px; }
  .hidden { display: none; }
  #msg { margin: 10px 0; color: #b03a2e; min-height: 18px; }

  /* Mobile (<=640px): tables turn into stacked cards — the header row
     hides, each row becomes a bordered card whose cells render as
     label/value lines (labels come from data-label in the row
     templates), and action cells flow their buttons in a wrapping
     row. Forms stack full-width. Desktop rendering is untouched. */
  @media (max-width: 640px) {
    .wrap { padding: 14px 10px 40px; }
    .card { padding: 12px; }
    .row { flex-direction: column; align-items: stretch; }
    .row input, .row select, .row button { width: 100% !important; min-width: 0 !important; flex: none !important; box-sizing: border-box; }
    .code { max-width: 100%; box-sizing: border-box; overflow-wrap: anywhere; font-size: 17px; }
    .mono { overflow-wrap: anywhere; }
    table, tbody, tr, td, th { display: block; width: 100%; box-sizing: border-box; }
    thead { display: none; }
    tbody tr { border: 1px solid #e2e5ec; border-radius: 8px; padding: 10px 12px; margin: 0 0 10px; }
    tbody tr:last-child { margin-bottom: 0; }
    td { border-bottom: 0; padding: 3px 0; overflow-wrap: anywhere; }
    td[data-label] { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
    td[data-label]::before { content: attr(data-label); flex: 0 0 60px; color: #889; font-size: 12px; }
    tbody td:first-child { font-size: 14px; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px dashed #eceef2; }
    tbody td[colspan] { border-bottom: 0; margin-bottom: 0; padding-bottom: 3px; }
    td.acts { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
    td.acts button.small { margin: 0; padding: 7px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="margin:14px 0">
    <a id="homeBtn" href="#"><button class="ghost small">← 返回我的后台</button></a>
    <button id="upBtn" class="ghost small hidden">← 上一级分销商</button>
  </div>
  <h2 id="title">加载中…</h2>
  <div class="card">
    <div id="summary" class="muted" style="margin-bottom:10px"></div>
    <h3>客户（设备）</h3>
    <table><thead><tr><th>机器码 / 备注</th><th>激活</th><th>到期</th><th>状态</th></tr></thead><tbody id="devBody"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody></table>
    <h3>游客</h3>
    <table><thead><tr><th>用户名</th><th>到期</th><th>状态</th></tr></thead><tbody id="guestBody"><tr><td colspan="4" class="muted">加载中…</td></tr></tbody></table>
    <h3>下级分销商</h3>
    <table><thead><tr><th>标识 / 名称</th><th>名下</th><th>状态</th><th>操作</th></tr></thead><tbody id="subBody"><tr><td colspan="4" class="muted">加载中…</td></tr></tbody></table>
  </div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const PAGE = "subtree.html";
const API = "/api/dist/subtree";
const ACT = false;
const params = new URLSearchParams(location.search);
const SLUG = (params.get("slug") || "").toLowerCase();
const FROM = params.get("from") || "";
const sess = (() => { try { return localStorage.getItem("v2dsess"); } catch { return null; } })();
const fmt = (ts) => ts ? new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false }) : "—";
async function api(path, opts = {}) {
  const headers = { "content-type": "application/json", ...(sess ? { "x-dsess": sess } : {}) };
  const res = await fetch(path, { ...opts, headers });
  return { status: res.status, data: await res.json().catch(() => ({})) };
}

function onData(data) {
  if (data.viewer) $("homeBtn").href = "/" + data.viewer;
}


async function load() {
  const { data } = await api(API + "?slug=" + encodeURIComponent(SLUG));
  if (!data.ok) {
    $("title").textContent = "打不开";
    $("summary").textContent = data.reason === "unauthorized" || data.reason === undefined
      ? "登录已失效，请返回重新登录。" : "没有这个分销商。";
    return;
  }
  if (window.onData) onData(data);
  $("title").textContent = `${data.dist.name || data.dist.slug}（${data.dist.slug} · 第${data.dist.level}级）名下`;
  $("summary").textContent = `整个下面共 ${data.totals.devices + data.totals.guests} 个用户：客户 ${data.totals.devices} 台 · 游客 ${data.totals.guests} 个 · 下级分销商 ${data.totals.subs} 个（这一页列的是直属：客户 ${data.devices.length} 台 · 待激活 ${data.pending} · 游客 ${data.guests.length} 个 · 下级 ${data.subs.length} 个）`;
  $("devBody").innerHTML = data.devices.length ? data.devices.map((d) => `<tr>
    <td class="mono" data-label="机器码">${d.machine}<div class="muted">${d.note || ""}</div></td>
    <td data-label="激活">${fmt(d.activated_at)}</td>
    <td data-label="到期">${d.expires_at ? fmt(d.expires_at) : "永久"}</td>
    <td data-label="状态">${d.status === "revoked" ? "已停用" : "正常"}</td>
    ${ACT ? `<td class="acts">${d.status === "revoked"
      ? `<button class="small ghost" onclick="devAct('${d.machine}','restore')">恢复</button>`
      : `<button class="small danger" onclick="devAct('${d.machine}','revoke')">停用线路</button>`}</td>` : ""}
  </tr>`).join("") : `<tr><td colspan="${ACT ? 5 : 4}" class="muted">没有直属客户</td></tr>`;
  $("guestBody").innerHTML = data.guests.length ? data.guests.map((g) => `<tr>
    <td data-label="用户名">${g.username}</td>
    <td data-label="到期">${g.expires_at ? fmt(g.expires_at) : "永久"}</td>
    <td data-label="状态">${g.status === "disabled" ? "已停用" : "正常"}</td>
    ${ACT ? `<td class="acts">${g.status === "disabled"
      ? `<button class="small ghost" onclick="guestAct('${g.id}','enable')">恢复</button>`
      : `<button class="small danger" onclick="guestAct('${g.id}','disable')">停用线路</button>`}</td>` : ""}
  </tr>`).join("") : `<tr><td colspan="${ACT ? 4 : 3}" class="muted">没有直属游客</td></tr>`;
  $("subBody").innerHTML = data.subs.length ? data.subs.map((x) => `<tr>
    <td class="mono" data-label="分销商">${x.slug}<div class="muted">${x.name || ""} · 第${x.level}级</div></td>
    <td data-label="名下">客户 ${x.devices} 台${x.pending ? "（待激活 " + x.pending + "）" : ""} · 游客 ${x.guests} 个 · 下级 ${x.children} 个</td>
    <td data-label="状态">${x.status === "disabled" ? "已停用" : "正常"}</td>
    <td class="acts"><a href="${PAGE}?slug=${x.slug}&from=${SLUG}"><button class="small ghost">进去看</button></a>
    ${ACT ? (x.status === "disabled"
      ? `<button class="small ghost" onclick="subAct('${x.slug}','enable')">恢复</button>`
      : `<button class="small danger" onclick="subAct('${x.slug}','disable')">停用</button>`) : ""}</td>
  </tr>`).join("") : `<tr><td colspan="4" class="muted">没有下级分销商</td></tr>`;
}
if (FROM) {
  const b = $("upBtn");
  b.classList.remove("hidden");
  b.onclick = () => { location.href = PAGE + "?slug=" + encodeURIComponent(FROM); };
}
load();
</script>
</body>
</html>
